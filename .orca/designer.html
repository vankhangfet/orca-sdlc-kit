<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Workflow Designer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,sans-serif; }
  button, select, input, textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  .hidden { display:none !important; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
  .brand { font-weight:700; margin-right:6px; } .brand span { color:var(--accent); font-weight:400; }
  .badge { background:#614d1f; color:var(--yellow); border-radius:10px; padding:1px 8px; font-size:12px; }
  .runcmd { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .runcmd input { width:380px; color:var(--dim); font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  nav.tabs { display:flex; gap:4px; padding:8px 12px 0; }
  nav.tabs button { border-bottom:2px solid transparent; border-radius:6px 6px 0 0; background:transparent; }
  nav.tabs button.active { border-bottom-color:var(--accent); color:var(--accent); }
  section.tab { display:none; padding:12px; }
  section.tab.active { display:block; }
  #tab-pipeline.active { display:grid; grid-template-columns:400px 1fr; gap:12px; align-items:start; }
  #canvas { display:flex; flex-direction:column; gap:6px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .card:hover { border-color:var(--accent); } .card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .card.off { opacity:.45; }
  .cardrow { display:flex; gap:8px; align-items:center; }
  .dot { background:#21262d; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex:none; }
  .cid { font-family:ui-monospace,Consolas,monospace; color:var(--accent); }
  .ctitle { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .errbadge { margin-left:auto; color:var(--red); font-size:12px; flex:none; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip { background:#21262d; border-radius:10px; padding:0 8px; font-size:11px; color:var(--dim); }
  .chip.agent { color:var(--green); }
  button.addstep { border-style:dashed; color:var(--dim); }
  #stepForm { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
  #stepForm .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  label.f { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--dim); }
  label.f > span b { color:var(--text); font-weight:400; }
  label.f input, label.f select, label.f textarea { background:var(--bg); }
  label.f textarea { resize:vertical; min-height:140px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .full { grid-column:1/-1; }
  .readcb { display:inline-flex; gap:6px; align-items:center; margin:2px 10px 2px 0; font-size:12px; color:var(--text); }
  .dim { color:var(--dim); font-size:12px; }
  .empty { color:var(--dim); padding:24px; text-align:center; border:1px dashed var(--border); border-radius:8px; }
  .formfoot { display:flex; gap:8px; margin-top:12px; }
  .formfoot .right { margin-left:auto; }
  #toasts { position:fixed; bottom:12px; right:12px; display:flex; flex-direction:column; gap:6px; z-index:20; }
  .toast { background:var(--panel); border:1px solid var(--green); border-radius:8px; padding:8px 12px; }
  .toast.bad { border-color:var(--red); }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; max-width:80vw; width:720px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog pre { max-height:60vh; overflow:auto; background:var(--bg); padding:10px; border-radius:6px; font-size:12px; white-space:pre-wrap; }
  details.menu { position:relative; }
  details.menu .menuitems { position:absolute; top:100%; left:0; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px; display:flex; flex-direction:column; gap:4px; min-width:230px; z-index:10; }
  details.menu .menuitems button { text-align:left; background:transparent; border:none; }
  details.menu .menuitems button:hover { color:var(--accent); }
  .vwarn { grid-column:1/-1; color:var(--red); font-size:12px; white-space:pre-wrap; }
  #sc-result pre { background:var(--bg); padding:10px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <span class="brand">orca <span>workflow designer</span></span>
  <select id="cfgSelect" title="open a config"></select>
  <details class="menu" id="newMenu">
    <summary style="cursor:pointer;list-style:none;padding:4px 8px;border:1px solid var(--border);border-radius:6px;">New ▾</summary>
    <div class="menuitems">
      <button id="newBlank">Blank workflow…</button>
      <button id="newTplSdlc">From template: sdlc</button>
      <button id="newTplFixbug">From template: fixbug</button>
      <button id="newTplCr">From template: cr</button>
      <button id="newTplDeliver">From template: sdlc + git-deliver</button>
      <button id="newDup">Duplicate current…</button>
    </div>
  </details>
  <button id="btnSave" class="primary">Save</button>
  <button id="btnDryRun">Dry-run</button>
  <span id="dirtyBadge" class="badge hidden">unsaved</span>
  <div class="runcmd">
    <input id="objective" title="objective for the run command" placeholder="objective...">
    <input id="cmdText" readonly>
    <button id="btnCopyCmd" title="copy the run command">⧉</button>
  </div>
</header>

<nav class="tabs">
  <button data-tab="pipeline" class="active">Pipeline</button>
  <button data-tab="defaults">Config defaults</button>
  <button data-tab="scaffold">New project</button>
</nav>

<section id="tab-pipeline" class="tab active">
  <div id="canvas"></div>
  <div id="stepForm"></div>
</section>

<section id="tab-defaults" class="tab">
  <!-- Task 7 fills this form -->
  <div class="empty">Config-level fields editor arrives with the next commit.</div>
</section>

<section id="tab-scaffold" class="tab">
  <!-- Task 7 fills this form -->
  <div class="empty">Project scaffolding arrives with the next commit.</div>
</section>

<div id="toasts"></div>
<dialog id="modal">
  <h3 id="modalTitle" style="margin:4px 0 10px;"></h3>
  <pre id="modalText"></pre>
  <div style="text-align:right;margin-top:8px;"><button id="modalClose">Close</button></div>
</dialog>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AGENTS = ["claude", "codex", "opencode", "gemini", "cursor", "grok", "kiro-cli"];
const S = { configs: [], path: null, cfg: null, sel: -1, dirty: false, objective: "" };

// --- API + toasts -----------------------------------------------------------
async function api(method, url, body) {
  const r = await fetch(url, { method,
    headers: { "x-designer-token": TOKEN, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error((j && j.error) || `${method} ${url} -> HTTP ${r.status}`);
  return j;
}
function toast(msg, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function markDirty() { S.dirty = true; $("dirtyBadge").classList.remove("hidden"); }
function confirmDiscard() {
  if (!S.dirty) return true;
  const yes = confirm("Discard unsaved changes?");
  if (!yes) $("cfgSelect").value = S.path && S.configs.some((c) => c.path === S.path) ? S.path : "__new__";
  return yes;
}

// --- config lifecycle -------------------------------------------------------
async function loadState() {
  const j = await api("GET", "/api/state");
  S.configs = j.configs;
  const sel = $("cfgSelect");
  sel.innerHTML = "";
  for (const c of S.configs) {
    const o = document.createElement("option");
    o.value = c.path;
    o.textContent = (c.template ? "tpl: " : "") + c.name;
    sel.appendChild(o);
  }
  const o = document.createElement("option");
  o.value = "__new__"; o.textContent = "(unsaved new workflow)";
  sel.appendChild(o);
  if (S.path && S.configs.some((c) => c.path === S.path)) sel.value = S.path;
  else if (!S.cfg) sel.value = "__new__";
}
async function loadConfig(path) {
  try {
    const j = await api("GET", "/api/config?path=" + encodeURIComponent(path));
    S.path = path; S.cfg = j.config; S.sel = -1; S.dirty = false;
    $("dirtyBadge").classList.add("hidden");
    renderAll(); renderDefaults();
  } catch (e) {
    toast(e.message, true);
    $("cfgSelect").value = S.path && S.configs.some((c) => c.path === S.path) ? S.path : "__new__";
  }
}
async function save() {
  if (!S.path || !S.cfg) return false;
  try {
    await api("POST", "/api/save", { path: S.path, config: S.cfg });
    S.dirty = false; $("dirtyBadge").classList.add("hidden");
    toast(`saved ${S.path}`);
    await loadState();
    return true;
  } catch (e) { toast(e.message, true); return false; }
}
async function dryRun() {
  if (!S.path || !S.cfg) return;
  try {
    if (S.dirty && !(await save())) return;   // dry-run reads the file on disk — bail on failed save
    const j = await api("POST", "/api/dry-run", { path: S.path });
    $("modalTitle").textContent = `dry-run ${S.path} — exit ${j.code}${j.timedOut ? " (TIMED OUT)" : ""}`;
    $("modalText").textContent = j.output || "(no output)";
    $("modal").showModal();
  } catch (e) { toast(e.message, true); }
}

// --- run command bar --------------------------------------------------------
function runCmd() {
  if (!S.path) return "";
  const cfgFlag = S.path !== "flow.config.json" ? ` --config ${S.path}` : "";
  const obj = (S.objective || "<objective>").replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  return `node .orca/flow.mjs "${obj}"${cfgFlag}`;
}
function renderCmd() { $("cmdText").value = runCmd(); }
async function copyCmd() {
  const t = runCmd(); if (!t) return;
  try { await navigator.clipboard.writeText(t); }
  catch { $("cmdText").select(); document.execCommand("copy"); }
  toast("run command copied");
}

// --- new workflow -----------------------------------------------------------
async function askName(def) {
  const name = prompt("Workflow name (file: <name>.config.json in .orca/):", def);
  if (name == null) return null;
  if (!/^[\w.-]+$/.test(name)) { toast("name may only contain letters, digits, '.', '_', '-'", true); return null; }
  if (S.configs.some((c) => c.name === name) && !confirm(`${name}.config.json already exists — overwrite it on Save?`)) return null;
  return name;
}
function adoptNew(name, cfg) {
  if (!confirmDiscard()) return;
  S.path = `${name}.config.json`; S.cfg = cfg; S.sel = 0; S.dirty = true;
  $("dirtyBadge").classList.remove("hidden");
  renderAll(); renderDefaults();
  $("cfgSelect").value = "__new__";
}
async function newBlank() {
  const name = await askName("my-flow"); if (!name) return;
  adoptNew(name, {
    artifactsDir: ".orca/artifacts", maxRetries: 2, autoRun: true,
    defaults: { timeoutMs: 900000, worktree: null, model: "default", readinessRetries: 3, readinessMinBytes: 200, nudgeRetries: 0, nudgeTimeoutMs: 120000 },
    pipeline: [{ id: "step-1", title: "Step 1", enabled: true, agent: "claude", writes: "STEP1.md", reads: [], spec: "You are ... Based on {reads}, write {out}: ..." }],
  });
}
async function newFromTemplate(path, defName) {
  const name = await askName(defName); if (!name) return;
  try { adoptNew(name, (await api("GET", "/api/config?path=" + encodeURIComponent(path))).config); }
  catch (e) { toast(e.message, true); }
}
async function duplicateCurrent() {
  if (!S.cfg) return toast("open a workflow first", true);
  const name = await askName((S.path || "flow").replace(/\.config\.json$/, "") + "-copy"); if (!name) return;
  adoptNew(name, JSON.parse(JSON.stringify(S.cfg)));
}

// --- rendering (canvas/form bodies land in Task 6) ---------------------------
function renderAll() { renderCanvas(); renderForm(); renderCmd(); }

// --- advisory validation (mirrors flow.mjs load-time rules; never blocks) ---
function parallelGroupOf(steps) {
  const idx = new Map(steps.map((s, i) => [s.id, i]));
  const groupOf = new Map();
  steps.forEach((s) => {
    if (s.parallelWith && idx.has(s.parallelWith)) {
      const g = groupOf.get(s.parallelWith) ?? s.parallelWith;
      groupOf.set(s.id, g);
      if (!groupOf.has(s.parallelWith)) groupOf.set(s.parallelWith, g);
    }
  });
  return groupOf;
}
function validateCfg(cfg) {
  const errs = [];
  const steps = (cfg.pipeline || []).filter((s) => s && s.id);
  const idx = new Map(steps.map((s, i) => [s.id, i]));
  steps.forEach((s, i) => {
    const seen = errs.some((e) => e.msg.includes(`duplicate id "${s.id}"`));
    if (steps.filter((x) => x.id === s.id).length > 1 && !seen) errs.push({ id: s.id, msg: `duplicate id "${s.id}"` });
    if (!s.agent) errs.push({ id: s.id, msg: `"${s.id}" has no agent` });
    (s.reads || []).forEach((rd) => {
      if (!idx.has(rd)) errs.push({ id: s.id, msg: `"${s.id}" reads unknown "${rd}"` });
      else if (idx.get(rd) >= i) errs.push({ id: s.id, msg: `"${s.id}" reads "${rd}" which is not EARLIER` });
      else if (!steps[idx.get(rd)].writes) errs.push({ id: s.id, msg: `"${s.id}" reads "${rd}" which has no writes` });
    });
    if (s.onFailGoto && !idx.has(s.onFailGoto)) errs.push({ id: s.id, msg: `"${s.id}" onFailGoto "${s.onFailGoto}" does not exist` });
    if (s.parallelWith && !idx.has(s.parallelWith)) errs.push({ id: s.id, msg: `"${s.id}" parallelWith unknown "${s.parallelWith}"` });
    else if (s.parallelWith && idx.get(s.parallelWith) >= i) errs.push({ id: s.id, msg: `"${s.id}" parallelWith must point at an EARLIER step` });
  });
  // parallel groups: contiguous + no intra-group reads (flat, like flow.mjs)
  const groupOf = parallelGroupOf(steps);
  for (const g of new Set(groupOf.values())) {
    const members = steps.filter((s) => s.id === g || groupOf.get(s.id) === g);
    const pos = members.map((s) => idx.get(s.id)).sort((a, b) => a - b);
    if (pos.some((p, k) => p !== pos[0] + k)) errs.push({ id: g, msg: `parallel group of "${g}" must be contiguous` });
    for (const m of members)
      for (const rd of m.reads || [])
        if (members.some((x) => x.id === rd)) errs.push({ id: m.id, msg: `"${m.id}" reads "${rd}" inside its own parallel group` });
  }
  return errs;
}

// --- pipeline canvas --------------------------------------------------------
function renderCanvas() {
  const host = $("canvas");
  host.innerHTML = "";
  if (!S.cfg) { host.innerHTML = '<div class="empty">No workflow open — pick one above or use New.</div>'; return; }
  const errs = validateCfg(S.cfg);
  S.cfg.pipeline.forEach((s, i) => {
    const mine = errs.filter((e) => e.id === s.id);
    const card = document.createElement("div");
    card.className = "card" + (i === S.sel ? " sel" : "") + (s.enabled === false ? " off" : "");
    card.draggable = true;
    card.innerHTML = `
      <div class="cardrow">
        <span class="dot">${i + 1}</span>
        <span class="cid">${esc(s.id || "(no id)")}</span>
        <span class="ctitle">${esc(s.title || "")}</span>
        ${mine.length ? `<span class="errbadge" title="${esc(mine.map((e) => e.msg).join("\n"))}">⚠ ${mine.length}</span>` : ""}
      </div>
      <div class="chips">
        <span class="chip agent">${esc(s.agent || "?")}</span>
        ${s.parallelWith ? `<span class="chip">∥ ${esc(s.parallelWith)}</span>` : ""}
        ${s.gate ? '<span class="chip">gate</span>' : ""}
        ${s.interactive ? '<span class="chip">interactive</span>' : ""}
        ${s.onFailGoto ? `<span class="chip">⟲ ${esc(s.onFailGoto)}</span>` : ""}
        ${(s.reads || []).length ? `<span class="chip">reads: ${esc(s.reads.join(", "))}</span>` : ""}
      </div>`;
    card.addEventListener("click", () => { S.sel = i; renderCanvas(); renderForm(); });
    card.addEventListener("dragstart", (ev) => ev.dataTransfer.setData("text/plain", String(i)));
    card.addEventListener("dragover", (ev) => ev.preventDefault());
    card.addEventListener("drop", (ev) => {
      ev.preventDefault();
      const from = Number(ev.dataTransfer.getData("text/plain"));
      if (Number.isInteger(from) && from !== i) {
        const [moved] = S.cfg.pipeline.splice(from, 1);
        S.cfg.pipeline.splice(i, 0, moved);
        S.sel = i; markDirty(); renderCanvas(); renderForm();
      }
    });
    host.appendChild(card);
  });
  const add = document.createElement("button");
  add.className = "addstep"; add.textContent = "+ add step";
  add.addEventListener("click", () => {
    let n = 1; while (S.cfg.pipeline.some((s) => s.id === `step-${n}`)) n++;
    S.cfg.pipeline.push({ id: `step-${n}`, title: `Step ${n}`, enabled: true, agent: "claude", writes: `STEP${n}.md`, reads: [], spec: "You are ... Based on {reads}, write {out}: ..." });
    S.sel = S.cfg.pipeline.length - 1; markDirty(); renderCanvas(); renderForm();
  });
  host.appendChild(add);
}

// --- step detail form -------------------------------------------------------
const STEP_TEXT_FIELDS = [
  ["id", "id", "planning"], ["title", "title", "Planning"], ["agent", "agent (CLI)", "claude"],
  ["model", "model (optional)", ""], ["writes", "writes (artifact file)", "PLAN.md"],
  ["progress", "progress (optional checklist file)", ""], ["effort", "effort (cold-start only)", ""],
];
const STEP_NUM_FIELDS = [
  ["timeoutMs", "timeoutMs"], ["hardTimeoutMs", "hardTimeoutMs"],
  ["nudgeRetries", "nudgeRetries"], ["nudgeTimeoutMs", "nudgeTimeoutMs"], ["startTimeoutMs", "startTimeoutMs"],
];
function renderForm() {
  const host = $("stepForm");
  const s = S.cfg && S.sel >= 0 ? S.cfg.pipeline[S.sel] : null;
  if (!s) { host.innerHTML = '<div class="empty">Select a step on the left.</div>'; return; }
  const i = S.sel;
  const earlier = S.cfg.pipeline.slice(0, i);
  const allIds = S.cfg.pipeline.map((x) => x.id).filter(Boolean);
  const datalist = `<datalist id="agents">${AGENTS.map((a) => `<option value="${a}">`).join("")}</datalist>`;
  const textHtml = STEP_TEXT_FIELDS.map(([k, label, ph]) => `
    <label class="f"><span>${label}</span>
      <input data-k="${k}" value="${esc(s[k] ?? "")}" ${k === "agent" ? 'list="agents"' : ""} ${ph ? `placeholder="${esc(ph)}"` : ""}></label>`).join("");
  const numHtml = STEP_NUM_FIELDS.map(([k, label]) => `
    <label class="f"><span>${label}</span><input type="number" data-num="${k}" value="${esc(s[k] ?? "")}"></label>`).join("");
  const readsHtml = earlier.length
    ? earlier.map((e2) => `
      <label class="readcb"><input type="checkbox" data-read="${esc(e2.id)}" ${(s.reads || []).includes(e2.id) ? "checked" : ""}>
        ${esc(e2.id)}${e2.writes ? ` → ${esc(e2.writes)}` : " ⚠ no writes"}</label>`).join("")
    : '<span class="dim">no earlier steps</span>';
  const optHtml = (list, cur, none) =>
    `<option value="" ${cur ? "" : "selected"}>${none}</option>` +
    list.map((v) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  host.innerHTML = `
    ${datalist}
    <div class="grid">
      ${textHtml}
      ${numHtml}
      <label class="f"><span>onFailGoto (loop back on failure)</span>
        <select data-sel="onFailGoto">${optHtml(allIds, s.onFailGoto, "— none —")}</select></label>
      <label class="f"><span>parallelWith (run concurrently with)</span>
        <select data-sel="parallelWith">${optHtml(earlier.map((e2) => e2.id), s.parallelWith, "— none —")}</select></label>
      <label class="f"><span>flags</span>
        <span>
          <label class="readcb"><input type="checkbox" data-flag="enabled" ${s.enabled !== false ? "checked" : ""}> enabled</label>
          <label class="readcb"><input type="checkbox" data-flag="gate" ${s.gate ? "checked" : ""}> gate</label>
          <label class="readcb"><input type="checkbox" data-flag="interactive" ${s.interactive ? "checked" : ""}> interactive</label>
        </span></label>
      <label class="f full"><span>spec (prompt; {out} {reads} {tasks} are substituted)</span>
        <textarea data-k="spec">${esc(s.spec ?? "")}</textarea></label>
      <label class="f full"><span>reads (steps this one consumes)</span><span>${readsHtml}</span></label>
    </div>
    <div class="formfoot">
      <span class="dim">step ${i + 1} of ${S.cfg.pipeline.length}</span>
      <button class="right" id="btnDupStep">Duplicate</button>
      <button id="btnDelStep" style="color:var(--red);">Delete step</button>
    </div>`;

  const touch = () => { markDirty(); renderCanvas(); };   // canvas only — the form keeps focus
  host.querySelectorAll("[data-k]").forEach((el) =>
    el.addEventListener("input", () => { s[el.dataset.k] = el.value; touch(); }));
  host.querySelectorAll("[data-num]").forEach((el) =>
    el.addEventListener("input", () => { if (el.value === "") delete s[el.dataset.num]; else s[el.dataset.num] = Number(el.value); touch(); }));
  host.querySelectorAll("[data-sel]").forEach((el) =>
    el.addEventListener("change", () => { if (el.value === "") delete s[el.dataset.sel]; else s[el.dataset.sel] = el.value; touch(); }));
  host.querySelectorAll("[data-flag]").forEach((el) =>
    el.addEventListener("change", () => {
      const k = el.dataset.flag;
      if (k === "enabled") s.enabled = el.checked;
      else if (el.checked) s[k] = true; else delete s[k];
      touch();
    }));
  host.querySelectorAll("[data-read]").forEach((el) =>
    el.addEventListener("change", () => {
      const id = el.dataset.read;
      s.reads = s.reads || [];
      s.reads = el.checked ? [...s.reads, id] : s.reads.filter((x) => x !== id);
      touch();
    }));
  $("btnDelStep").addEventListener("click", () => {
    S.cfg.pipeline.splice(i, 1);
    S.sel = Math.min(i, S.cfg.pipeline.length - 1);
    markDirty(); renderCanvas(); renderForm();
  });
  $("btnDupStep").addEventListener("click", () => {
    let n = 1; const base = s.id || "step";
    while (S.cfg.pipeline.some((x) => x.id === `${base}-${n}`)) n++;
    S.cfg.pipeline.splice(i + 1, 0, JSON.parse(JSON.stringify({ ...s, id: `${base}-${n}` })));
    S.sel = i + 1; markDirty(); renderCanvas(); renderForm();
  });
}
function renderDefaults() { /* Task 7 */ }

// --- wire-up ----------------------------------------------------------------
$("cfgSelect").addEventListener("change", (e) => { if (e.target.value !== "__new__" && confirmDiscard()) loadConfig(e.target.value); });
$("btnSave").addEventListener("click", save);
$("btnDryRun").addEventListener("click", dryRun);
$("btnCopyCmd").addEventListener("click", copyCmd);
$("objective").addEventListener("input", (e) => { S.objective = e.target.value; renderCmd(); });
$("modalClose").addEventListener("click", () => $("modal").close());
$("newBlank").addEventListener("click", () => { $("newMenu").removeAttribute("open"); newBlank(); });
$("newTplSdlc").addEventListener("click", () => { $("newMenu").removeAttribute("open"); newFromTemplate("flow.config.json", "sdlc"); });
$("newTplFixbug").addEventListener("click", () => { $("newMenu").removeAttribute("open"); newFromTemplate("fixbug.config.json", "fixbug"); });
$("newTplCr").addEventListener("click", () => { $("newMenu").removeAttribute("open"); newFromTemplate("cr.config.json", "cr"); });
$("newTplDeliver").addEventListener("click", () => { $("newMenu").removeAttribute("open"); newFromTemplate("workflow-template/sdlc.config.json", "sdlc-deliver"); });
$("newDup").addEventListener("click", () => { $("newMenu").removeAttribute("open"); duplicateCurrent(); });
document.querySelectorAll("nav.tabs button").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll("section.tab").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    $("tab-" + b.dataset.tab).classList.add("active");
  }));
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

loadState().catch((e) => toast(e.message, true));
</script>
